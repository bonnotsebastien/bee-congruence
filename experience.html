          desc: 'N\'arrivant pas à poser un non calme et posé, vous avez besoin de convoquer la colère pour réussir à vous défendre.'
        }
      },
      {
        id: 'esquive',
        icon: '🏃',
        label: 'J\'esquive ou je repousse ma réponse indéfiniment.',
        sub: 'Je tarde à répondre en espérant que la personne trouvera une autre solution.',
        mirror: {
          pattern: 'L\'évitement par inconfort de la confrontation.',
          desc: 'Vous gagnez du temps à court terme mais conservez une anxiété latente et une image fuyante.'
        }
      },
      {
        id: 'autre',
        icon: '✍️',
        label: 'Autre réaction personnelle...',
        sub: 'Une autre stratégie d\'adaptation.',
        mirror: {
          pattern: 'Votre posture face aux limites et à l\'affirmation de soi.',
          desc: 'Poser une limite ne signifie pas rejeter l\'autre : c\'est se respecter pour rester disponible sainement.'
        }
      }
    ],
    responses: [
      {
        id: 'oui_amer',
        type: 'Réaction réflexe de soumission',
        text: '« Bon... d\'accord, mais c\'est bien parce que c\'est toi... » (en soupirant)',
        impact: 'Installe de la rancœur et valide le fait qu\'on peut empiéter sur votre temps.'
      },
      {
        id: 'non_bienveillant',
        type: 'Limite saine & bienveillante',
        text: '« J\'aimerais pouvoir t\'aider, mais mon planning ne me le permet pas aujourd\'hui. Je préfère être honnête tout de suite. »',
        impact: 'Un refus respectueux, clair et sans fausse excuse qui préserve la relation.'
      },
      {
        id: 'alternative_constructive',
        type: 'Négociation constructive',
        text: '« Je ne peux pas faire ça dans l\'urgence. En revanche, je peux y consacrer 20 minutes demain matin si c\'est encore utile. »',
        impact: 'Définit votre cadre tout en offrant une aide réaliste.'
      }
    ]
  }
];

// ── State ──
let currentSituationIndex = 0;
let currentStep = 1;
let userState = {
  selectedOptionId: null,
  customText: '',
  selectedResponseId: null,
  selectedDomain: 'Couple',
  actionNote: ''
};

// ── Render Controller ──
function render() {
  const container = document.getElementById('expContent');
  const stepCounter = document.getElementById('expStepCounter');
  const stepTitle = document.getElementById('expStepTitle');
  const progressBar = document.getElementById('expProgressBar');

  stepCounter.textContent = `Étape ${currentStep} / 5`;
  progressBar.style.width = `${currentStep * 20}%`;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  switch(currentStep) {
    case 1:
      stepTitle.textContent = 'La situation réelle';
      renderStep1(container);
      break;
    case 2:
      stepTitle.textContent = 'Le Miroir (Prise de conscience)';
      renderStep2(container);
      break;
    case 3:
      stepTitle.textContent = 'L\'espace de choix';
      renderStep3(container);
      break;
    case 4:
      stepTitle.textContent = 'Transfert dans votre vie';
      renderStep4(container);
      break;
    case 5:
      stepTitle.textContent = 'Votre synthèse BEE';
      renderStep5(container);
      break;
  }
}

// ── STEP 1: Situation ──
function renderStep1(container) {
  const sit = SITUATIONS[currentSituationIndex];

  container.innerHTML = `
    <div class="exp-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <div class="exp-tag" style="margin-bottom:0;">🐝 1. Observation spontanée</div>
        <div style="display:flex;gap:6px;">
          ${SITUATIONS.map((s, idx) => `
            <button onclick="switchSituation(${idx})" style="
              border: 1px solid ${idx === currentSituationIndex ? 'var(--orange)' : '#EDE0CC'};
              background: ${idx === currentSituationIndex ? 'rgba(217,119,6,0.1)' : 'white'};
              color: ${idx === currentSituationIndex ? 'var(--orange-dark)' : 'var(--brown-mid)'};
              font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700;
              padding: 4px 10px; border-radius: 20px; cursor: pointer;
            ">
              ${s.tab}
            </button>
          `).join('')}
        </div>
      </div>

      <h1 class="exp-title">${sit.title}</h1>
      <p class="exp-desc">Prenez quelques secondes pour vous imaginer concrètement dans cette scène du quotidien.</p>

      <div class="exp-situation-box">
        <div class="exp-situation-text">
          ${sit.context}
        </div>
      </div>

      <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:15px;color:var(--brown-dark);margin-bottom:14px;">
        ${sit.question}
      </div>

      <div class="exp-options">
        ${sit.options.map(opt => `
          <button class="exp-option-btn ${userState.selectedOptionId === opt.id ? 'selected' : ''}" onclick="selectOption('${opt.id}')">
            <span class="exp-option-ico">${opt.icon}</span>
            <div class="exp-option-content">
              <div class="exp-option-label">${opt.label}</div>
              <div class="exp-option-sub">${opt.sub}</div>
            </div>
          </button>
        `).join('')}
      </div>

      <div class="exp-custom-box" id="customInputBox" style="${userState.selectedOptionId === 'autre' ? 'display:block;' : 'display:none;'}">
        <textarea class="exp-textarea" id="customText" placeholder="Décrivez en quelques mots ce qui se passe spontanément en vous..." oninput="userState.customText = this.value">${userState.customText}</textarea>
      </div>

      <div class="exp-actions">
        <span style="font-family:'Nunito',sans-serif;font-size:13px;color:var(--brown-light);">
          🔒 Aucune mauvaise réponse · Rien n'est jugé
        </span>
        <button class="exp-btn-primary" id="btnStep1" ${!userState.selectedOptionId ? 'disabled' : ''} onclick="goToStep(2)">
          Découvrir ce qui se joue →
        </button>
      </div>
    </div>
  `;
}

function switchSituation(idx) {
  currentSituationIndex = idx;
  userState.selectedOptionId = null;
  userState.customText = '';
  userState.selectedResponseId = null;
  render();
}

function selectOption(id) {
  userState.selectedOptionId = id;
  const customBox = document.getElementById('customInputBox');
  if (customBox) {
    customBox.style.display = id === 'autre' ? 'block' : 'none';
  }
  document.querySelectorAll('.exp-option-btn').forEach(btn => {
    btn.classList.remove('selected');
  });
  event.currentTarget.classList.add('selected');
  const btn = document.getElementById('btnStep1');
  if (btn) btn.disabled = false;
}

// ── STEP 2: Le Miroir ──
function renderStep2(container) {
  const sit = SITUATIONS[currentSituationIndex];
  const chosen = sit.options.find(o => o.id === userState.selectedOptionId) || sit.options[0];

  container.innerHTML = `
    <div class="exp-card">
      <div class="exp-tag">🪞 2. Le miroir sans jugement</div>
      <h2 class="exp-title">Vous venez d'identifier votre réaction automatique.</h2>
      <p class="exp-desc">Réagir est un réflexe forgé par notre histoire. Mettre de la lumière dessus change tout.</p>

      <div class="exp-mirror-card">
        <div class="exp-mirror-header">
          <span style="font-size:26px;">${chosen.icon}</span>
          <div class="exp-mirror-title">${chosen.mirror.pattern}</div>
        </div>
        <div class="exp-mirror-body">
          ${chosen.mirror.desc}
          ${userState.selectedOptionId === 'autre' && userState.customText ? `<br><br><em>Ce que vous avez noté : « ${userState.customText} »</em>` : ''}
        </div>
      </div>

      <div class="exp-pause-box">
        <div class="exp-pause-title">« Réagir est automatique. Répondre est un choix. »</div>
        <p class="exp-pause-desc">
          Entre le déclencheur extérieur et ce que vous faites, il existe un espace : <strong>la pause consciente</strong>.
          C'est dans cet espace que réside votre liberté relationnelle.
        </p>
        <div class="exp-loop-horizontal">
          <div class="exp-loop-node">1. Déclencheur</div>
          <span class="exp-loop-arrow">→</span>
          <div class="exp-loop-node">2. Réflexe automatique</div>
          <span class="exp-loop-arrow">→</span>
          <div class="exp-loop-node active-pause">✦ 3. PAUSE CONSCIENTE</div>
          <span class="exp-loop-arrow">→</span>
          <div class="exp-loop-node">4. Choix de réponse</div>
        </div>
      </div>

      <div class="exp-actions">
        <button class="exp-btn-secondary" onclick="goToStep(1)">← Modifier mon choix</button>
        <button class="exp-btn-primary" onclick="goToStep(3)">
          Explorer une autre réponse →
        </button>
      </div>
    </div>
  `;
}

// ── STEP 3: L'autre réponse ──
function renderStep3(container) {
  const sit = SITUATIONS[currentSituationIndex];

  container.innerHTML = `
    <div class="exp-card">
      <div class="exp-tag">🌿 3. Élargir le champ des réponses</div>
      <h2 class="exp-title">Laquelle pourriez-vous essayer ?</h2>
      <p class="exp-desc">
        Il ne s'agit pas d'adopter une "bonne réponse" morale ou parfaite.
        Il s'agit de découvrir que vous n'êtes pas enfermé(e) dans un seul schéma.
      </p>

      <div class="exp-options">
        ${sit.responses.map(resp => `
          <button class="exp-option-btn ${userState.selectedResponseId === resp.id ? 'selected' : ''}" onclick="selectResponse('${resp.id}')">
            <span class="exp-option-ico">💬</span>
            <div class="exp-option-content">
              <div style="font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--orange);margin-bottom:3px;">
                ${resp.type}
              </div>
              <div class="exp-option-label">${resp.text}</div>
              <div class="exp-option-sub">Effet : ${resp.impact}</div>
            </div>
          </button>
        `).join('')}
      </div>

      <div id="step3Feedback" style="${userState.selectedResponseId ? 'display:block;' : 'display:none;'}" class="exp-mirror-card">
        <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:var(--orange-dark);margin-bottom:6px;">
          ✨ Ce que vous venez de faire :
        </div>
        <p style="font-family:'Lora',serif;font-size:15px;color:var(--ink);margin:0;line-height:1.7;">
          En envisageant une autre façon de réagir, <strong>vous venez d'activer votre espace de choix</strong>. Vous cessez d'être piloté(e) par l'urgence pour réaligner vos paroles avec votre intention réelle.
        </p>
      </div>

      <div class="exp-actions">
        <button class="exp-btn-secondary" onclick="goToStep(2)">← Étape précédente</button>
        <button class="exp-btn-primary" id="btnStep3" ${!userState.selectedResponseId ? 'disabled' : ''} onclick="goToStep(4)">
          Transférer dans mon quotidien →
        </button>
      </div>
    </div>
  `;
}

function selectResponse(id) {
  userState.selectedResponseId = id;
  document.querySelectorAll('.exp-option-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  const fb = document.getElementById('step3Feedback');
  if (fb) fb.style.display = 'block';
  const btn = document.getElementById('btnStep3');
  if (btn) btn.disabled = false;
}

// ── STEP 4: Transfert Réel ──
function renderStep4(container) {
  const domains = ['Couple', 'Famille', 'Travail', 'Amitié', 'Conflit', 'Rejet', 'Poser des limites', 'Prise de décision'];

  container.innerHTML = `
    <div class="exp-card">
      <div class="exp-tag">🌱 4. Ancrage dans votre vie réelle</div>
      <h2 class="exp-title">Où ce schéma se rejoue-t-il le plus ?</h2>
      <p class="exp-desc">Pour qu'un déclic dure, il doit se relier à votre quotidien.</p>

      <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:var(--brown-dark);margin-bottom:12px;">
        Dans quelle sphère ressentez-vous le plus souvent ce réflexe ?
      </div>

      <div class="exp-domains-grid">
        ${domains.map(d => `
          <div class="exp-domain-chip ${userState.selectedDomain === d ? 'selected' : ''}" onclick="selectDomain('${d}')">
            ${d}
          </div>
        `).join('')}
      </div>

      <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:var(--brown-dark);margin-bottom:10px;margin-top:20px;">
        Que pourriez-vous essayer de faire ou dire différemment la prochaine fois ?
      </div>
      <textarea class="exp-textarea" id="actionNoteInput" placeholder="Exemple : Respirer 3 secondes avant d'écrire, ou dire calmement ce dont j'ai besoin plutôt que me refermer..." oninput="userState.actionNote = this.value">${userState.actionNote}</textarea>

      <div class="exp-actions">
        <button class="exp-btn-secondary" onclick="goToStep(3)">← Retour</button>
        <button class="exp-btn-primary" onclick="goToStep(5)">
          Voir ma synthèse d'entraînement →
        </button>
      </div>
    </div>
  `;
}

function selectDomain(domain) {
  userState.selectedDomain = domain;
  document.querySelectorAll('.exp-domain-chip').forEach(c => c.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

// ── STEP 5: Synthèse & Résultats ──
function renderStep5(container) {
  const sit = SITUATIONS[currentSituationIndex];
  const chosenOpt = sit.options.find(o => o.id === userState.selectedOptionId) || sit.options[0];
  const chosenResp = sit.responses.find(r => r.id === userState.selectedResponseId) || sit.responses[2] || sit.responses[0];

  // Save session record locally
  try {
    const history = JSON.parse(localStorage.getItem('bee_7min_history') || '[]');
    history.push({
      date: new Date().toISOString(),
      situation: sit.title,
      reflex: chosenOpt.label,
      newResponse: chosenResp.text,
      domain: userState.selectedDomain,
      actionNote: userState.actionNote
    });
    localStorage.setItem('bee_7min_history', JSON.stringify(history));
  } catch(e) {}

  container.innerHTML = `
    <div class="exp-card">
      <div class="exp-result-hero">
        <div class="exp-result-icon">✨</div>
        <div class="exp-tag">7 minutes chrono · Mission accomplie</div>
        <h2 class="exp-title">Votre synthèse d'entraînement</h2>
        <p style="font-family:'Lora',serif;font-size:16px;color:var(--brown-mid);max-width:540px;margin:0 auto;">
          Vous êtes parti(e) d'un réflexe automatique pour ouvrir une possibilité de réponse choisie.
        </p>
      </div>

      <div class="exp-box-synthesis">
        <div class="exp-synthesis-label">1. Votre réflexe relationnel observé</div>
        <div class="exp-synthesis-title">${chosenOpt.label}</div>
        <div class="exp-synthesis-text">
          ${chosenOpt.mirror.desc}
        </div>
      </div>

      <div class="exp-box-synthesis" style="border-left:4px solid var(--orange);">
        <div class="exp-synthesis-label">2. Votre nouvelle piste de réponse (Sphère : ${userState.selectedDomain})</div>
        <div class="exp-synthesis-title" style="color:var(--orange-dark);">
          ${chosenResp.text}
        </div>
        <div class="exp-synthesis-text">
          ${userState.actionNote ? `<strong>Votre engagement concret :</strong> « ${userState.actionNote} »` : `Une formulation qui privilégie la clarté et la maturité relationnelle, sans agressivité ni soumission.`}
        </div>
      </div>

      <div class="exp-takeaway">
        <div class="exp-takeaway-item">
          <span style="font-size:22px;">👁️</span>
          <strong>1. Conscience</strong>
          <span style="font-size:12px;color:var(--brown-light);">Voir l'automatisme</span>
        </div>
        <span style="color:var(--orange);font-size:18px;">→</span>
        <div class="exp-takeaway-item">
          <span style="font-size:22px;">⏸️</span>
          <strong>2. Choix</strong>
          <span style="font-size:12px;color:var(--brown-light);">Créer la pause</span>
        </div>
        <span style="color:var(--orange);font-size:18px;">→</span>
        <div class="exp-takeaway-item">
          <span style="font-size:22px;">💪</span>
          <strong>3. Entraînement</strong>
          <span style="font-size:12px;color:var(--brown-light);">Répéter dans la vraie vie</span>
        </div>
      </div>

      <div class="exp-final-actions">
        <button class="exp-btn-primary exp-btn-full" onclick="resetExperience(true)">
          🔄 Je m'entraîne sur une autre situation (${(currentSituationIndex + 1) % SITUATIONS.length + 1}/${SITUATIONS.length})
        </button>

        <a href="questionnaire.html" class="exp-btn-secondary exp-btn-full" style="text-align:center;">
          🧭 Découvrir mon profil relationnel complet (Diagnostic)
        </a>

        <a href="inscription.html" class="exp-btn-secondary exp-btn-full" style="text-align:center;background:rgba(217,119,6,0.06);border-color:rgba(217,119,6,0.3);color:var(--orange-dark);">
          🐝 Rejoindre la ruche pour débloquer tous les scénarios d'entraînement →
        </a>
      </div>
    </div>
  `;
}

// ── Navigation ──
function goToStep(step) {
  currentStep = step;
  render();
}

function resetExperience(nextSituation = false) {
  if (nextSituation) {
    currentSituationIndex = (currentSituationIndex + 1) % SITUATIONS.length;
  }
  currentStep = 1;
  userState = {
    selectedOptionId: null,
    customText: '',
    selectedResponseId: null,
    selectedDomain: 'Couple',
    actionNote: ''
  };
  render();
}

// Start on load
render();
</script>
</body>
</html>
