<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Abeille (tête) -->
  <circle cx="150" cy="140" r="35" fill="#FFD54A" />
  
  <!-- Yeux -->
  <circle cx="140" cy="135" r="4" fill="#333333" />
  <circle cx="160" cy="135" r="4" fill="#333333" />
  
  <!-- Sourire -->
  <path d="M135 150 Q150 160 165 150" stroke="#333333" stroke-width="3" fill="none"/>

  <!-- Antennes -->
  <path d="M140 110 Q130 90 120 80" stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="80" r="4" fill="#333333"/>
  <path d="M160 110 Q170 90 180 80" stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="80" r="4" fill="#333333"/>

  <!-- Corps de l'abeille -->
  <ellipse cx="150" cy="210" rx="45" ry="35" fill="#FFD54A"/>
  <path d="M120 190 L180 190" stroke="#333333" stroke-width="8"/>
  <path d="M120 210 L180 210" stroke="#333333" stroke-width="8"/>
  <path d="M120 230 L180 230" stroke="#333333" stroke-width="8"/>

  <!-- Ailes en symbole infini -->
  <!-- Boucle gauche (jaune) -->
  <path d="M190 180 C230 140 290 140 330 180 C290 220 230 220 190 180" fill="none" stroke="#FFD54A" stroke-width="14"/>

  <!-- Boucle droite (bleu) -->
  <path d="M330 180 C370 140 430 140 470 180 C430 220 370 220 330 180" fill="none" stroke="#1E88E5" stroke-width="14"/>

  <!-- Texte Bee Congruence -->
  <text x="260" y="120" font-family="Segoe Script, 'Brush Script MT', cursive" font-size="52" fill="#FFD54A">Bee</text>
  <text x="380" y="120" font-family="Segoe Script, 'Brush Script MT', cursive" font-size="52" fill="#1E88E5">Congruence</text>

  <!-- Baseline ÉQUILIBRE & HARMONIE RELATIONNELLE -->
  <text x="270" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#777777" letter-spacing="2">ÉQUILIBRE &amp; HARMONIE RELATIONNELLE</text>
</svg>
